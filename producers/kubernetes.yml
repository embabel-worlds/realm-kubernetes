# Every producer is one LIST call on the cluster's API, keyed by a namespace, made when a query
# reaches it. Nothing is stored and nothing is cached for long: this is the state of a running
# system, and thirty seconds keeps a burst of questions to one call each without hiding a crash.
#
# `project:` lifts a nested field to a property. `compute:` says what a field means, as one Cypher
# expression over the record (`r`): labels with dots in their names are read there.
#
# A pod's FIRST container is lifted onto the pod itself (image, restarts, why it last stopped),
# because most services run one; every container is also a KubeContainer the HAS_CONTAINER edge
# brings, for a pod with sidecars.

- name: kubePods
  kind: remote
  operation: kubeListPods
  records: "$.items[*]"
  keyArgs: [namespace]
  echoKeyAs: namespaceKey
  maxKeysPerCall: 1
  # The list call takes ONE fieldSelector; a second rule on it would overwrite the first, so the
  # one pushed is the pod's phase ("the running pods"). The app label is not pushed: `app` is
  # either of two labels, and a labelSelector names one, so it would drop pods carrying the other.
  pushdown:
    - { property: phase, op: EQUALS, argPath: fieldSelector, clause: "status.phase={value}" }
  project:
    id: metadata.uid
    name: metadata.name
    namespace: metadata.namespace
    createdAt: metadata.creationTimestamp
    ownerKind: metadata.ownerReferences[0].kind
    ownerName: metadata.ownerReferences[0].name
    node: spec.nodeName
    phase: status.phase
    startedAt: status.startTime
    containers: spec.containers[*].name
    image: spec.containers[0].image
    imageId: status.containerStatuses[0].imageID
    ready: status.containerStatuses[0].ready
    restarts: status.containerStatuses[0].restartCount
    waitingReason: status.containerStatuses[0].state.waiting.reason
    waitingMessage: status.containerStatuses[0].state.waiting.message
    runningSince: status.containerStatuses[0].state.running.startedAt
    lastStopReason: status.containerStatuses[0].lastState.terminated.reason
    lastExitCode: status.containerStatuses[0].lastState.terminated.exitCode
    lastStoppedAt: status.containerStatuses[0].lastState.terminated.finishedAt
    lastStopMessage: status.containerStatuses[0].lastState.terminated.message
    memoryLimit: spec.containers[0].resources.limits.memory
  compute:
    app: "coalesce(r.metadata.labels['app.kubernetes.io/name'], r.metadata.labels['app'], '')"
    version: "coalesce(r.metadata.labels['app.kubernetes.io/version'], '')"
    imageDigest: "CASE WHEN coalesce(r.imageId, '') CONTAINS 'sha256:' THEN 'sha256:' + last(split(r.imageId, 'sha256:')) ELSE '' END"
    imageTag: "CASE WHEN last(split(coalesce(r.image, ''), '/')) CONTAINS ':' THEN last(split(r.image, ':')) ELSE '' END"
    workload: "CASE WHEN r.ownerKind = 'ReplicaSet' AND r.ownerName CONTAINS '-' THEN substring(r.ownerName, 0, size(r.ownerName) - size(last(split(r.ownerName, '-'))) - 1) ELSE coalesce(r.ownerName, '') END"
    logKey: "r.metadata.namespace + '/' + r.metadata.name"
    crashLooping: "coalesce(r.waitingReason, '') = 'CrashLoopBackOff'"
    outOfMemory: "coalesce(r.lastStopReason, '') = 'OOMKilled'"
  cache: { kind: ttl, seconds: 30, negativeTtlSeconds: 30 }

- name: kubeDeployments
  kind: remote
  operation: kubeListDeployments
  records: "$.items[*]"
  keyArgs: [namespace]
  echoKeyAs: namespaceKey
  maxKeysPerCall: 1
  # A deployment by name is one record, not the namespace's list.
  pushdown:
    - { property: name, op: EQUALS, argPath: fieldSelector, clause: "metadata.name={value}" }
  project:
    id: metadata.uid
    name: metadata.name
    namespace: metadata.namespace
    createdAt: metadata.creationTimestamp
    replicas: spec.replicas
    readyReplicas: status.readyReplicas
    updatedReplicas: status.updatedReplicas
    availableReplicas: status.availableReplicas
    unavailableReplicas: status.unavailableReplicas
    image: spec.template.spec.containers[0].image
  compute:
    app: "coalesce(r.metadata.labels['app.kubernetes.io/name'], r.metadata.labels['app'], '')"
    version: "coalesce(r.spec.template.metadata.labels['app.kubernetes.io/version'], '')"
    revision: "coalesce(r.metadata.annotations['deployment.kubernetes.io/revision'], '')"
    rolledOut: "coalesce(r.updatedReplicas, 0) = coalesce(r.replicas, 0) AND coalesce(r.readyReplicas, 0) = coalesce(r.replicas, 0)"
  cache: { kind: ttl, seconds: 30, negativeTtlSeconds: 30 }

- name: kubeEvents
  kind: remote
  operation: kubeListEvents
  records: "$.items[*]"
  keyArgs: [namespace]
  echoKeyAs: namespaceKey
  maxKeysPerCall: 1
  # Warnings are what a question about a namespace wants; events support fieldSelector on type.
  pushdown:
    - { property: type, op: EQUALS, argPath: fieldSelector, clause: "type={value}" }
  project:
    id: metadata.uid
    namespace: metadata.namespace
    type: type
    reason: reason
    message: message
    count: count
    involvedKind: involvedObject.kind
    involvedName: involvedObject.name
    firstAt: firstTimestamp
    lastAt: lastTimestamp
    source: source.component
  compute:
    at: "coalesce(r.lastAt, r.eventTime, r.firstAt, r.metadata.creationTimestamp)"
    isWarning: "r.type = 'Warning'"
  cache: { kind: ttl, seconds: 30, negativeTtlSeconds: 30 }

# What a pod's first container wrote, read from the cluster when a query reaches it and split into
# log events by the appliance's own log reader (`body: events`): a logged exception and its whole
# trace are one event, with a fingerprint that counts the same failure across pods. Nothing is
# copied. The last 5,000 lines are read: `tailLines` bounds what the cluster sends.
#
#   kubePodLogs          the container running now
#   kubePreviousPodLogs  the container before the last restart: what a crashed container wrote.
#                        A pod that has never restarted has none, which is an empty answer.
- name: kubePodLogs
  kind: remote
  operation: kubeReadPodLog
  keyArgs: [namespace, name]
  echoKeyAs: podKey
  maxKeysPerCall: 1
  # The log endpoint takes only a relative window (sinceSeconds) and a line count: no literal
  # predicate on an event maps to either.
  pushdown: []
  body: events
  records: "$[*]"
  args:
    tailLines: 5000
  compute:
    id: "r.podKey + '#current#' + toString(r.line)"
    container: "'current'"
    pod: "last(split(r.podKey, '/'))"
    namespace: "split(r.podKey, '/')[0]"
  cache: { kind: ttl, seconds: 30, negativeTtlSeconds: 30 }

- name: kubePreviousPodLogs
  kind: remote
  operation: kubeReadPodLog
  keyArgs: [namespace, name]
  echoKeyAs: podKey
  maxKeysPerCall: 1
  # The log endpoint takes only a relative window (sinceSeconds) and a line count: no literal
  # predicate on an event maps to either.
  pushdown: []
  body: events
  records: "$[*]"
  args:
    tailLines: 5000
    previous: true
  emptyErrorPatterns: ["previous terminated container", "not found"]
  compute:
    id: "r.podKey + '#previous#' + toString(r.line)"
    container: "'previous'"
    pod: "last(split(r.podKey, '/'))"
    namespace: "split(r.podKey, '/')[0]"
  cache: { kind: ttl, seconds: 30, negativeTtlSeconds: 30 }
