# Every producer is one LIST call on the cluster's API, keyed by a namespace, made when a query
# reaches it. Nothing is stored and nothing is cached for long: this is the state of a running
# system, and thirty seconds keeps a burst of questions to one call each without hiding a crash.
#
# `project:` lifts a nested field to a property. `compute:` says what a field means, as one Cypher
# expression over the record (`r`): labels with dots in their names are read there.
#
# A pod's FIRST container is lifted onto the pod itself (image, restarts, why it last stopped),
# because most services run one; every container is also a KubeContainer the HAS_CONTAINER edge
# brings, for a pod with sidecars.

- name: kubePods
  kind: remote
  operation: kubeListPods
  records: "$.items[*]"
  keyArgs: [namespace]
  echoKeyAs: namespaceKey
  maxKeysPerCall: 1
  project:
    id: metadata.uid
    name: metadata.name
    namespace: metadata.namespace
    createdAt: metadata.creationTimestamp
    ownerKind: metadata.ownerReferences[0].kind
    ownerName: metadata.ownerReferences[0].name
    node: spec.nodeName
    phase: status.phase
    startedAt: status.startTime
    containers: spec.containers[*].name
    image: spec.containers[0].image
    imageId: status.containerStatuses[0].imageID
    ready: status.containerStatuses[0].ready
    restarts: status.containerStatuses[0].restartCount
    waitingReasonRaw: status.containerStatuses[0].state.waiting.reason
    waitingMessageRaw: status.containerStatuses[0].state.waiting.message
    runningSince: status.containerStatuses[0].state.running.startedAt
    lastStopReason: status.containerStatuses[0].lastState.terminated.reason
    lastExitCode: status.containerStatuses[0].lastState.terminated.exitCode
    lastStoppedAt: status.containerStatuses[0].lastState.terminated.finishedAt
    lastStopMessageRaw: status.containerStatuses[0].lastState.terminated.message
    memoryLimit: spec.containers[0].resources.limits.memory
  compute:
    app: "coalesce(r.metadata.labels['app.kubernetes.io/name'], r.metadata.labels['app'], '')"
    instance: "coalesce(r.metadata.labels['app.kubernetes.io/instance'], '')"
    component: "coalesce(r.metadata.labels['app.kubernetes.io/component'], '')"
    partOf: "coalesce(r.metadata.labels['app.kubernetes.io/part-of'], '')"
    version: "coalesce(r.metadata.labels['app.kubernetes.io/version'], '')"
    imageDigest: "CASE WHEN coalesce(r.imageId, '') CONTAINS 'sha256:' THEN 'sha256:' + last(split(r.imageId, 'sha256:')) ELSE '' END"
    imageTag: "CASE WHEN last(split(coalesce(r.image, ''), '/')) CONTAINS ':' THEN last(split(r.image, ':')) ELSE '' END"
    workload: "CASE WHEN r.ownerKind = 'ReplicaSet' AND r.ownerName CONTAINS '-' THEN substring(r.ownerName, 0, size(r.ownerName) - size(last(split(r.ownerName, '-'))) - 1) ELSE coalesce(r.ownerName, '') END"
    logKey: "r.metadata.namespace + '/' + r.metadata.name"
    # State-dependent fields are stamped on EVERY record, empty where the state does not apply (a
    # running container is not waiting), so a healthy namespace does not read as a door that never
    # asks for them.
    waitingReason: "coalesce(r.waitingReasonRaw, '')"
    waitingMessage: "coalesce(r.waitingMessageRaw, '')"
    lastStopMessage: "coalesce(r.lastStopMessageRaw, '')"
    crashLooping: "coalesce(r.waitingReasonRaw, '') = 'CrashLoopBackOff'"
    outOfMemory: "coalesce(r.lastStopReason, '') = 'OOMKilled'"
  cache: { kind: ttl, seconds: 30, negativeTtlSeconds: 30 }

- name: kubeDeployments
  kind: remote
  operation: kubeListDeployments
  records: "$.items[*]"
  keyArgs: [namespace]
  echoKeyAs: namespaceKey
  maxKeysPerCall: 1
  project:
    id: metadata.uid
    name: metadata.name
    namespace: metadata.namespace
    createdAt: metadata.creationTimestamp
    replicas: spec.replicas
    readyReplicas: status.readyReplicas
    updatedReplicas: status.updatedReplicas
    availableReplicas: status.availableReplicas
    unavailableReplicasRaw: status.unavailableReplicas
    image: spec.template.spec.containers[0].image
  compute:
    # Kubernetes omits unavailableReplicas when it is zero; 0 is the answer, stamped on every record.
    unavailableReplicas: "coalesce(r.unavailableReplicasRaw, 0)"
    app: "coalesce(r.metadata.labels['app.kubernetes.io/name'], r.metadata.labels['app'], '')"
    instance: "coalesce(r.metadata.labels['app.kubernetes.io/instance'], '')"
    component: "coalesce(r.metadata.labels['app.kubernetes.io/component'], '')"
    partOf: "coalesce(r.metadata.labels['app.kubernetes.io/part-of'], '')"
    version: "coalesce(r.spec.template.metadata.labels['app.kubernetes.io/version'], '')"
    revision: "coalesce(r.metadata.annotations['deployment.kubernetes.io/revision'], '')"
    rolledOut: "coalesce(r.updatedReplicas, 0) = coalesce(r.replicas, 0) AND coalesce(r.readyReplicas, 0) = coalesce(r.replicas, 0)"
  cache: { kind: ttl, seconds: 30, negativeTtlSeconds: 30 }

- name: kubeStatefulSets
  kind: remote
  operation: kubeListStatefulSets
  records: "$.items[*]"
  keyArgs: [namespace]
  echoKeyAs: namespaceKey
  maxKeysPerCall: 1
  project:
    id: metadata.uid
    name: metadata.name
    namespace: metadata.namespace
    createdAt: metadata.creationTimestamp
    serviceName: spec.serviceName
    replicas: spec.replicas
    readyReplicas: status.readyReplicas
    updatedReplicas: status.updatedReplicas
    availableReplicas: status.availableReplicas
    currentRevision: status.currentRevision
    updateRevision: status.updateRevision
    image: spec.template.spec.containers[0].image
  compute:
    app: "coalesce(r.metadata.labels['app.kubernetes.io/name'], r.metadata.labels['app'], '')"
    instance: "coalesce(r.metadata.labels['app.kubernetes.io/instance'], '')"
    component: "coalesce(r.metadata.labels['app.kubernetes.io/component'], '')"
    partOf: "coalesce(r.metadata.labels['app.kubernetes.io/part-of'], '')"
    version: "coalesce(r.spec.template.metadata.labels['app.kubernetes.io/version'], '')"
    rolledOut: "coalesce(r.updatedReplicas, 0) = coalesce(r.replicas, 0) AND coalesce(r.readyReplicas, 0) = coalesce(r.replicas, 0)"
  cache: { kind: ttl, seconds: 30, negativeTtlSeconds: 30 }

# A Service's selector is a map of labels; the three standard ones are lifted to their own properties
# so a view can match a service to the workload it fronts without parsing, and the whole map is kept
# as `selector` text for the rest.
- name: kubeServices
  kind: remote
  operation: kubeListServices
  records: "$.items[*]"
  keyArgs: [namespace]
  echoKeyAs: namespaceKey
  maxKeysPerCall: 1
  project:
    id: metadata.uid
    name: metadata.name
    namespace: metadata.namespace
    createdAt: metadata.creationTimestamp
    type: spec.type
    clusterIP: spec.clusterIP
    externalNameRaw: spec.externalName
    port: spec.ports[0].port
    targetPortRaw: spec.ports[0].targetPort
    nodePort: spec.ports[0].nodePort
    portNumbers: spec.ports[*].port
    portProtocols: spec.ports[*].protocol
    loadBalancerIps: status.loadBalancer.ingress[*].ip
    loadBalancerHostnames: status.loadBalancer.ingress[*].hostname
  compute:
    app: "coalesce(r.metadata.labels['app.kubernetes.io/name'], r.metadata.labels['app'], '')"
    instance: "coalesce(r.metadata.labels['app.kubernetes.io/instance'], '')"
    component: "coalesce(r.metadata.labels['app.kubernetes.io/component'], '')"
    partOf: "coalesce(r.metadata.labels['app.kubernetes.io/part-of'], '')"
    ports: "[i IN range(0, size(coalesce(r.portNumbers, [])) - 1) | toString(r.portNumbers[i]) + '/' + coalesce(r.portProtocols[i], 'TCP')]"
    targetPort: "toString(coalesce(r.targetPortRaw, ''))"
    selector: "reduce(acc = '', k IN keys(coalesce(r.spec.selector, {})) | acc + CASE WHEN acc = '' THEN '' ELSE ',' END + k + '=' + r.spec.selector[k])"
    externalName: "coalesce(r.externalNameRaw, '')"
    selectorApp: "coalesce(r.spec.selector['app.kubernetes.io/name'], r.spec.selector['app'], '')"
    selectorInstance: "coalesce(r.spec.selector['app.kubernetes.io/instance'], '')"
    selectorComponent: "coalesce(r.spec.selector['app.kubernetes.io/component'], '')"
    loadBalancerAddresses: "[a IN coalesce(r.loadBalancerIps, []) + coalesce(r.loadBalancerHostnames, []) WHERE a IS NOT NULL]"
  cache: { kind: ttl, seconds: 30, negativeTtlSeconds: 30 }

# One slice per service (several for a large one); types/ brings each endpoint as a KubeEndpoint
# from the same fetch, so service → pod is one hop and one call.
- name: kubeEndpointSlices
  kind: remote
  operation: kubeListEndpointSlices
  records: "$.items[*]"
  keyArgs: [namespace]
  echoKeyAs: namespaceKey
  maxKeysPerCall: 1
  project:
    id: metadata.uid
    name: metadata.name
    namespace: metadata.namespace
    addressType: addressType
    portNumbers: ports[*].port
    portProtocols: ports[*].protocol
    pods: endpoints[*].targetRef.name
    readyFlags: endpoints[*].conditions.ready
  compute:
    service: "coalesce(r.metadata.labels['kubernetes.io/service-name'], '')"
    lastChangedAt: "coalesce(r.metadata.annotations['endpoints.kubernetes.io/last-change-trigger-time'], '')"
    ports: "[i IN range(0, size(coalesce(r.portNumbers, [])) - 1) | toString(r.portNumbers[i]) + '/' + coalesce(r.portProtocols[i], 'TCP')]"
    endpoints: "size(coalesce(r.pods, []))"
    readyEndpoints: "size([f IN coalesce(r.readyFlags, []) WHERE f = true])"
  cache: { kind: ttl, seconds: 30, negativeTtlSeconds: 30 }

- name: kubeIngresses
  kind: remote
  operation: kubeListIngresses
  records: "$.items[*]"
  keyArgs: [namespace]
  echoKeyAs: namespaceKey
  maxKeysPerCall: 1
  project:
    id: metadata.uid
    name: metadata.name
    namespace: metadata.namespace
    createdAt: metadata.creationTimestamp
    className: spec.ingressClassName
    hosts: spec.rules[*].host
    paths: spec.rules[*].http.paths[*].path
    backendServices: spec.rules[*].http.paths[*].backend.service.name
    tlsHosts: spec.tls[*].hosts
    addressIps: status.loadBalancer.ingress[*].ip
    addressHostnames: status.loadBalancer.ingress[*].hostname
  compute:
    tls: "size(coalesce(r.tlsHosts, [])) > 0"
    addresses: "[a IN coalesce(r.addressIps, []) + coalesce(r.addressHostnames, []) WHERE a IS NOT NULL]"
  cache: { kind: ttl, seconds: 30, negativeTtlSeconds: 30 }

- name: kubeEvents
  kind: remote
  operation: kubeListEvents
  records: "$.items[*]"
  keyArgs: [namespace]
  echoKeyAs: namespaceKey
  maxKeysPerCall: 1
  project:
    id: metadata.uid
    namespace: metadata.namespace
    type: type
    reason: reason
    message: message
    count: count
    involvedKind: involvedObject.kind
    involvedName: involvedObject.name
    firstAt: firstTimestamp
    lastAt: lastTimestamp
    source: source.component
  compute:
    at: "coalesce(r.lastAt, r.eventTime, r.firstAt, r.metadata.creationTimestamp)"
    isWarning: "r.type = 'Warning'"
  cache: { kind: ttl, seconds: 30, negativeTtlSeconds: 30 }

# What a pod's first container wrote, read from the cluster when a query reaches it and split into
# log events by the appliance's own log reader (`body: events`): a logged exception and its whole
# trace are one event, with a fingerprint that counts the same failure across pods. Nothing is
# copied. The last 5,000 lines are read: `tailLines` bounds what the cluster sends.
#
#   kubePodLogs          the container running now
#   kubePreviousPodLogs  the container before the last restart: what a crashed container wrote.
#                        A pod that has never restarted has none, which is an empty answer.
- name: kubePodLogs
  kind: remote
  operation: kubeReadPodLog
  keyArgs: [namespace, name]
  echoKeyAs: podKey
  maxKeysPerCall: 1
  body: events
  records: "$[*]"
  args:
    tailLines: 5000
  # A container that has written nothing yet answers 200 with no body: an empty log, not an error.
  emptyErrorPatterns: ["Empty response body"]
  compute:
    id: "r.podKey + '#current#' + toString(r.line)"
    container: "'current'"
    pod: "last(split(r.podKey, '/'))"
    namespace: "split(r.podKey, '/')[0]"
  cache: { kind: ttl, seconds: 30, negativeTtlSeconds: 30 }

- name: kubePreviousPodLogs
  kind: remote
  operation: kubeReadPodLog
  keyArgs: [namespace, name]
  echoKeyAs: podKey
  maxKeysPerCall: 1
  body: events
  records: "$[*]"
  args:
    tailLines: 5000
    previous: true
  # A pod that never restarted answers 400 "previous terminated container … not found"; one whose
  # previous container wrote nothing answers 200 with NO body, which the engine reports as an error
  # ("Empty response body") rather than as zero events (me#4292). Both are an empty log.
  emptyErrorPatterns: ["previous terminated container", "not found", "Empty response body"]
  compute:
    id: "r.podKey + '#previous#' + toString(r.line)"
    container: "'previous'"
    pod: "last(split(r.podKey, '/'))"
    namespace: "split(r.podKey, '/')[0]"
  cache: { kind: ttl, seconds: 30, negativeTtlSeconds: 30 }
