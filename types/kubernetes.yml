# A Kubernetes cluster, read live. Nothing here is stored: every node below is VIRTUAL, fetched from
# the cluster's API for the namespace a query pins, and gone when the query ends.
#
#   KubeNamespace ─HAS_POD▶ KubePod ─HAS_CONTAINER▶ KubeContainer
#                 ─HAS_DEPLOYMENT▶ KubeDeployment
#                 ─HAS_STATEFUL_SET▶ KubeStatefulSet
#                 ─HAS_SERVICE▶ KubeService
#                 ─HAS_ENDPOINT_SLICE▶ KubeEndpointSlice
#                 ─HAS_INGRESS▶ KubeIngress
#                 ─HAS_EVENT▶ KubeEvent
#   KubePod ─HAS_LOG_EVENT▶ KubeLogEvent            (what the running container wrote)
#           ─HAS_PREVIOUS_LOG_EVENT▶ KubeLogEvent   (what the container before the last restart wrote)
#
# Which cluster is set once per world (KUBERNETES_API_SERVER), not per query.
#
# Routing is deterministic and comes from three lists. A Service names the pods it fronts by a label
# selector; the cluster resolves that selector into EndpointSlices, one endpoint per pod, each saying
# whether the pod is ready; an Ingress names the Services it routes hosts and paths to. So "which pods
# answer for the carts service right now" is KubeService → KubeEndpointSlice (same `service` name),
# whose `pods` are KubePod names, with no guessing from names.
#
# Grouping into applications uses the standard labels and nothing else: `app` is
# app.kubernetes.io/name, `instance` is app.kubernetes.io/instance (one deployed copy of an
# application, which is what a Helm release stamps), `component` is app.kubernetes.io/component (the
# role a workload plays in it: service, database, cache), `partOf` is app.kubernetes.io/part-of. A
# workload without them has empty strings, never an invented group.

- name: KubeNamespace
  visibility: internal
  userAnchor: false
  description: "A namespace of the cluster this world reads, as a door onto what runs in it. Pin it ONLY as one literal {name:'shop'} and traverse HAS_POD, HAS_DEPLOYMENT, HAS_STATEFUL_SET, HAS_SERVICE, HAS_ENDPOINT_SLICE, HAS_INGRESS or HAS_EVENT. It is not stored and does not need to exist in the graph."
  properties:
    name: { identity: true, description: "The namespace's name. Identity." }

- name: KubePod
  description: "One pod as the cluster reports it now, identified by its uid (`id`); `name` is unique within its namespace. Where it runs, the image and version it runs, whether it is ready, how often it has restarted, and why its container last stopped. Reached from (:KubeNamespace {name})-[:HAS_POD]->. The pod's FIRST container is described on the pod itself (image, ready, restarts, lastStopReason); every container is a KubeContainer through HAS_CONTAINER. `version` is what the pod's labels claim (app.kubernetes.io/version), and `imageDigest` is the exact image: the two things a running container is traced to its commit by."
  examples:
    # Pin the namespace as one literal; everything else filters the pods it brings.
    - q: "which cart pods in shop are crash-looping, and on which version"
      cypher: |
        MATCH (n:KubeNamespace {name: 'shop'})-[:HAS_POD]->(p:KubePod)
        WHERE p.app = 'cart' AND p.crashLooping
        RETURN p.name AS pod, p.version AS version, p.restarts AS restarts, p.lastStopReason AS lastStopReason
  properties:
    id: { identity: true, description: "The pod's uid. Identity." }
    name: "The pod's name."
    namespace: "The namespace it lives in, the same value as the KubeNamespace it was reached from."
    app: "The application it belongs to: the label app.kubernetes.io/name, else `app`."
    instance: "The deployed copy of the application it belongs to: the label app.kubernetes.io/instance, which a Helm release stamps on everything it installs. Empty when unlabelled."
    component: "The role it plays in its application: the label app.kubernetes.io/component (service, database, cache, as the author named it). Empty when unlabelled."
    partOf: "The larger application this one is part of: the label app.kubernetes.io/part-of. Empty when unlabelled."
    workload: "The Deployment (or other owner) that made it, by name."
    ownerKind: "The kind of the pod's first owner, as Kubernetes names it: ReplicaSet (a Deployment's), StatefulSet, DaemonSet, Job, Node (a static pod); not exhaustive. Empty for a bare pod."
    ownerName: "The owner's name; for a Deployment's pod, the ReplicaSet of one rollout."
    version: "The label app.kubernetes.io/version: what the pod says it is. Often the commit or the release."
    image: "The image the first container was asked to run, as written: name and tag."
    imageTag: "The tag of that image."
    imageDigest: "The digest of the image actually running, `sha256:…`: which exact build."
    imageId: "The image id as the node reports it."
    node: "The node it runs on."
    phase: { type: string, description: "The pod's lifecycle phase, exactly as Kubernetes reports it.", values: [Pending, Running, Succeeded, Failed, Unknown] }
    ready: { type: boolean, description: "True when the first container passes its readiness check." }
    restarts: { type: int, description: "How many times the first container has restarted." }
    logKey: "`<namespace>/<name>`: what the pod's log is read by."
    crashLooping: { type: boolean, description: "True when the container is waiting in CrashLoopBackOff." }
    outOfMemory: { type: boolean, description: "True when the container was last stopped for exceeding its memory limit (OOMKilled)." }
    waitingReason: "Why the container is not running now: CrashLoopBackOff, ImagePullBackOff, ContainerCreating. Empty when it is running."
    waitingMessage: "The cluster's sentence for that."
    runningSince: "When the current container started, ISO-8601 date-time in UTC as the cluster reports it (2026-11-05T09:30:00Z); empty unless it is running."
    lastStopReason: "Why the container last stopped: Error, OOMKilled, Completed. Empty if it never has."
    lastExitCode: { type: int, description: "The exit code of that stop; 137 is a kill, usually for memory." }
    lastStoppedAt: "When the first container last stopped, ISO-8601 date-time in UTC as the cluster reports it (2026-11-05T09:30:00Z); empty if it never has."
    lastStopMessage: "The end of what the container wrote before it stopped, when the cluster kept it (at most 80 lines)."
    memoryLimit: "The first container's memory limit, as written (`640Mi`)."
    containers: { cardinality: LIST, description: "The names of the pod's containers." }
    createdAt: "When the cluster created the pod object, ISO-8601 date-time in UTC as the cluster reports it (2026-11-05T09:30:00Z)."
    startedAt: "When the kubelet acknowledged the pod on its node, ISO-8601 date-time in UTC as the cluster reports it (2026-11-05T09:30:00Z); empty while unscheduled."
  virtualJoins:
    - anchorLabel: KubeNamespace
      relationship: HAS_POD
      keyField: name
      recordKeyField: namespaceKey
      producer: kubePods
      maxFanoutTotal: 5000
      description: "The pods of ONE namespace, as they are now: `MATCH (n:KubeNamespace {name:$namespace})-[:HAS_POD]->(p:KubePod)`."
      brings:
        - childType: KubeContainer
          relationship: HAS_CONTAINER
          records: "$.status.containerStatuses[*]"
          id: containerID
          project:
            id: containerID
            name: name
            image: image
            imageId: imageID
            ready: ready
            restarts: restartCount
            waitingReason: state.waiting.reason
            lastStopReason: lastState.terminated.reason
            lastExitCode: lastState.terminated.exitCode
            lastStoppedAt: lastState.terminated.finishedAt

- name: KubeContainer
  description: "One container of a pod as the cluster reports it now, identified by its runtime id (`id`); `name` is unique within the pod. Reached ONLY from (:KubePod)-[:HAS_CONTAINER]->: the pod is where its name and namespace are."
  properties:
    id: { identity: true, description: "The container's runtime id. Identity." }
    name: "The container's name in the pod."
    image: "The image it runs."
    imageId: "The image id, with its digest."
    ready: { type: boolean, description: "True when it passes its readiness check." }
    restarts: { type: int, description: "How many times it has restarted." }
    waitingReason: "Why it is not running now; empty when it is."
    lastStopReason: "Why it last stopped: Error, OOMKilled, Completed."
    lastExitCode: { type: int, description: "The exit code of that stop." }
    lastStoppedAt: "When it last stopped, ISO-8601 date-time in UTC as the cluster reports it (2026-11-05T09:30:00Z); empty if it never has."

- name: KubeDeployment
  description: "One Deployment, identified by its uid (`id`); `name` is unique within its namespace. How many replicas it wants, how many are ready and how many run the newest rollout, and the image and version it is rolling out. Reached from (:KubeNamespace {name})-[:HAS_DEPLOYMENT]->. `rolledOut` false with updatedReplicas < replicas is a rollout in progress or stuck: old pods still serving beside new ones that are not ready."
  properties:
    id: { identity: true, description: "The deployment's uid. Identity." }
    name: "The deployment's name."
    namespace: "The namespace it lives in, the same value as the KubeNamespace it was reached from."
    app: "The application: the label app.kubernetes.io/name, else `app`."
    instance: "The deployed copy of the application: the label app.kubernetes.io/instance. Empty when unlabelled."
    component: "The role it plays in its application: the label app.kubernetes.io/component. Empty when unlabelled."
    partOf: "The larger application this one is part of: the label app.kubernetes.io/part-of. Empty when unlabelled."
    version: "The version label on the pods it is rolling out now."
    image: "The image it is rolling out now."
    revision: "The rollout's number."
    replicas: { type: int, description: "How many pods it wants." }
    readyReplicas: { type: int, description: "How many are ready." }
    updatedReplicas: { type: int, description: "How many run the newest rollout." }
    availableReplicas: { type: int, description: "How many are available." }
    unavailableReplicas: { type: int, description: "How many are not." }
    rolledOut: { type: boolean, description: "True when every wanted pod runs the newest rollout and is ready." }
    createdAt: "When the cluster created the deployment object, ISO-8601 date-time in UTC as the cluster reports it (2026-11-05T09:30:00Z)."
  virtualJoins:
    - anchorLabel: KubeNamespace
      relationship: HAS_DEPLOYMENT
      keyField: name
      recordKeyField: namespaceKey
      producer: kubeDeployments
      maxFanoutTotal: 2000
      description: "The deployments of ONE namespace: `MATCH (n:KubeNamespace {name:$namespace})-[:HAS_DEPLOYMENT]->(d:KubeDeployment)`."

- name: KubeStatefulSet
  description: "One StatefulSet, identified by its uid (`id`); `name` is unique within its namespace. The workload shape databases, queues and caches run as: how many replicas it wants, how many are ready and how many run the newest revision, and the image and version it runs. Reached from (:KubeNamespace {name})-[:HAS_STATEFUL_SET]->. Its pods are named `<name>-0`, `<name>-1`, in order."
  properties:
    id: { identity: true, description: "The stateful set's uid. Identity." }
    name: "The stateful set's name."
    namespace: "The namespace it lives in, the same value as the KubeNamespace it was reached from."
    app: "The application: the label app.kubernetes.io/name, else `app`."
    instance: "The deployed copy of the application: the label app.kubernetes.io/instance. Empty when unlabelled."
    component: "The role it plays in its application: the label app.kubernetes.io/component (mysql, postgresql, rabbitmq, as the author named it). Empty when unlabelled."
    partOf: "The larger application this one is part of: the label app.kubernetes.io/part-of. Empty when unlabelled."
    version: "The version label on the pods it runs now."
    image: "The image its first container runs, as written: name and tag."
    serviceName: "The headless Service that gives its pods stable names."
    replicas: { type: int, description: "How many pods it wants." }
    readyReplicas: { type: int, description: "How many are ready." }
    updatedReplicas: { type: int, description: "How many run the newest revision." }
    availableReplicas: { type: int, description: "How many are available." }
    currentRevision: "The revision most pods run."
    updateRevision: "The newest revision; equal to currentRevision when the rollout is complete."
    rolledOut: { type: boolean, description: "True when every wanted pod runs the newest revision and is ready." }
    createdAt: "When the cluster created it, ISO-8601 date-time in UTC as the cluster reports it (2026-11-05T09:30:00Z)."
  virtualJoins:
    - anchorLabel: KubeNamespace
      relationship: HAS_STATEFUL_SET
      keyField: name
      recordKeyField: namespaceKey
      producer: kubeStatefulSets
      maxFanoutTotal: 2000
      description: "The stateful sets of ONE namespace: `MATCH (n:KubeNamespace {name:$namespace})-[:HAS_STATEFUL_SET]->(s:KubeStatefulSet)`."

- name: KubeService
  description: "One Service, identified by its uid (`id`); `name` is unique within its namespace and is the DNS name other pods call it by. A stable address in front of a set of pods: its type (ClusterIP is reachable inside the cluster only; NodePort and LoadBalancer also from outside), its ports, and the label selector that chooses its pods. Reached from (:KubeNamespace {name})-[:HAS_SERVICE]->. Which pods it resolves to right now, and whether they are ready, is the KubeEndpointSlice with the same `service` name; `selectorApp`, `selectorInstance` and `selectorComponent` say which workload it fronts by label."
  properties:
    id: { identity: true, description: "The service's uid. Identity." }
    name: "The service's name, which is its DNS name in the namespace."
    namespace: "The namespace it lives in, the same value as the KubeNamespace it was reached from."
    app: "The application: the label app.kubernetes.io/name, else `app`."
    instance: "The deployed copy of the application: the label app.kubernetes.io/instance. Empty when unlabelled."
    component: "The role of the workload it fronts, from its own labels: app.kubernetes.io/component. Empty when unlabelled."
    type: { type: string, description: "How the service is exposed, exactly as Kubernetes names it.", values: [ClusterIP, NodePort, LoadBalancer, ExternalName] }
    clusterIP: "The virtual IP inside the cluster; `None` for a headless service, whose DNS name resolves to its pods directly."
    externalName: "For an ExternalName service, the DNS name it aliases; empty otherwise."
    ports: { cardinality: LIST, description: "The ports it serves, each as `<port>/<protocol>` (`80/TCP`)." }
    port: { type: int, description: "Its first port, which is the one a one-port service is called on." }
    targetPort: "What the first port forwards to on the pod: a number or a named container port (`http`)."
    nodePort: { type: int, description: "The node port of the first port, for a NodePort or LoadBalancer service; null otherwise." }
    selector: "The label selector that chooses its pods, as `key=value` pairs joined by commas; empty for a service with no selector (one whose endpoints are managed by hand or an ExternalName)."
    selectorApp: "The app.kubernetes.io/name the selector asks for; empty when it does not."
    selectorInstance: "The app.kubernetes.io/instance the selector asks for; empty when it does not."
    selectorComponent: "The app.kubernetes.io/component the selector asks for; empty when it does not."
    loadBalancerAddresses: { cardinality: LIST, description: "The external IPs or hostnames a LoadBalancer service was given; empty while pending, and on a cluster with no load balancer." }
    createdAt: "When the cluster created it, ISO-8601 date-time in UTC as the cluster reports it (2026-11-05T09:30:00Z)."
  virtualJoins:
    - anchorLabel: KubeNamespace
      relationship: HAS_SERVICE
      keyField: name
      recordKeyField: namespaceKey
      producer: kubeServices
      maxFanoutTotal: 2000
      description: "The services of ONE namespace: `MATCH (n:KubeNamespace {name:$namespace})-[:HAS_SERVICE]->(s:KubeService)`."

- name: KubeEndpointSlice
  description: "One EndpointSlice, identified by its uid (`id`): the cluster's own resolution of a Service's selector into pods, right now. `service` names the KubeService it belongs to; `pods` are the KubePod names it points at and `readyEndpoints` how many of them take traffic. A service with no endpoints, or none ready, has an address that nothing answers on. Reached from (:KubeNamespace {name})-[:HAS_ENDPOINT_SLICE]->. A large service has several slices."
  properties:
    id: { identity: true, description: "The slice's uid. Identity." }
    name: "The slice's name, generated by the cluster from the service's."
    namespace: "The namespace it lives in, the same value as the KubeNamespace it was reached from."
    service: "The Service this slice resolves: the label kubernetes.io/service-name, equal to a KubeService.name in the same namespace."
    addressType: { type: string, description: "The kind of address the endpoints carry.", values: [IPv4, IPv6, FQDN] }
    ports: { cardinality: LIST, description: "The pod ports the service's ports are forwarded to, each as `<port>/<protocol>`." }
    endpoints: { type: int, description: "How many endpoints the slice holds: pods the selector matched, ready or not." }
    readyEndpoints: { type: int, description: "How many of them are ready to take traffic. 0 with endpoints > 0 is a service whose pods are all failing their readiness checks." }
    pods: { cardinality: LIST, description: "The names of the pods the endpoints point at." }
    lastChangedAt: "When the endpoints last changed, ISO-8601 date-time in UTC as the cluster reports it (2026-11-05T09:30:00Z); empty when the cluster did not record it."
  virtualJoins:
    - anchorLabel: KubeNamespace
      relationship: HAS_ENDPOINT_SLICE
      keyField: name
      recordKeyField: namespaceKey
      producer: kubeEndpointSlices
      maxFanoutTotal: 5000
      description: "The endpoint slices of ONE namespace: `MATCH (n:KubeNamespace {name:$namespace})-[:HAS_ENDPOINT_SLICE]->(es:KubeEndpointSlice)`; join `es.service` to a KubeService.name, and a pod with `p.name IN es.pods`."

- name: KubeIngress
  description: "One Ingress, identified by its uid (`id`); `name` is unique within its namespace. HTTP routing from outside the cluster: which hosts and paths it accepts and which Services it sends them to. Reached from (:KubeNamespace {name})-[:HAS_INGRESS]->. `backendServices` are KubeService names in the same namespace. A namespace with no Ingress has none; its services are reached by port-forward, NodePort or a LoadBalancer."
  properties:
    id: { identity: true, description: "The ingress's uid. Identity." }
    name: "The ingress's name."
    namespace: "The namespace it lives in, the same value as the KubeNamespace it was reached from."
    className: "The IngressClass that implements it (nginx, traefik, alb); empty when it relies on the cluster's default."
    hosts: { cardinality: LIST, description: "The hostnames its rules accept; a rule with no host accepts any." }
    paths: { cardinality: LIST, description: "The URL paths its rules match, in rule order." }
    backendServices: { cardinality: LIST, description: "The Service names its paths route to, in rule order; each is a KubeService.name in the same namespace." }
    tls: { type: boolean, description: "True when it terminates TLS for at least one host." }
    addresses: { cardinality: LIST, description: "The addresses the ingress controller gave it: IPs or hostnames; empty while pending." }
    createdAt: "When the cluster created it, ISO-8601 date-time in UTC as the cluster reports it (2026-11-05T09:30:00Z)."
  virtualJoins:
    - anchorLabel: KubeNamespace
      relationship: HAS_INGRESS
      keyField: name
      recordKeyField: namespaceKey
      producer: kubeIngresses
      maxFanoutTotal: 1000
      description: "The ingresses of ONE namespace: `MATCH (n:KubeNamespace {name:$namespace})-[:HAS_INGRESS]->(i:KubeIngress)`."

- name: KubeEvent
  description: "One event the cluster recorded in a namespace, identified by its uid (`id`): what it did or what went wrong, to which object, and how often. Reached from (:KubeNamespace {name})-[:HAS_EVENT]->. THE WINDOW: a cluster keeps events for about an hour, so this is recent history only. `isWarning` true is what went wrong: BackOff, Unhealthy, FailedScheduling, OOMKilling."
  properties:
    id: { identity: true, description: "The event's uid. Identity." }
    namespace: "The namespace it lives in, the same value as the KubeNamespace it was reached from."
    type: { type: string, description: "Normal or Warning, as Kubernetes classifies the event.", values: [Normal, Warning] }
    isWarning: { type: boolean, description: "True for a Warning." }
    reason: "The cluster's one-word reason: BackOff, Unhealthy, Pulled, Killing, ScalingReplicaSet."
    message: "Its sentence."
    count: { type: int, description: "How many times it has happened." }
    involvedKind: "The kind of object the event is about, as Kubernetes names it: Pod, Deployment, ReplicaSet, Node, Job and others; not exhaustive."
    involvedName: "That object's name."
    at: "When it last happened, ISO-8601 date-time in UTC as the cluster reports it (2026-11-05T09:30:00Z): lastTimestamp, else eventTime, else when the event was created."
    firstAt: "When it first happened, ISO-8601 date-time in UTC as the cluster reports it (2026-11-05T09:30:00Z); empty for events reported only by eventTime."
    source: "The component that reported it."
  virtualJoins:
    - anchorLabel: KubeNamespace
      relationship: HAS_EVENT
      keyField: name
      recordKeyField: namespaceKey
      producer: kubeEvents
      maxFanoutTotal: 5000
      description: "The recent events of ONE namespace: `MATCH (n:KubeNamespace {name:$namespace})-[:HAS_EVENT]->(e:KubeEvent)`."

- name: KubeLogEvent
  visibility: internal
  userAnchor: false
  description: "One event in a pod's log, identified by id `<namespace>/<pod>#<current|previous>#<line>`, read from the cluster when a query reaches it: from a line that starts an event to the next, so a logged exception is one event with its whole trace. Reached from a KubePod by HAS_LOG_EVENT (the container running now) or HAS_PREVIOUS_LOG_EVENT (the container before the last restart, which is where a crash is). `fingerprint` is the same for the same failure, so it can be counted across pods. The last 5,000 lines of the first container are read."
  examples:
    # A crash is in the PREVIOUS container's log: read both edges, and count by fingerprint.
    - q: "what exceptions did the crashed cart pods in shop log"
      cypher: |
        MATCH (n:KubeNamespace {name: 'shop'})-[:HAS_POD]->(p:KubePod {app: 'cart'})
        MATCH (p)-[:HAS_PREVIOUS_LOG_EVENT]->(e:KubeLogEvent {hasTrace: true})
        RETURN e.exception AS exception, e.rootCause AS rootCause, count(*) AS occurrences, count(DISTINCT p.name) AS pods
        ORDER BY occurrences DESC
  properties:
    id: { identity: true, description: "`<namespace>/<pod>#<current|previous>#<line>`. Identity." }
    podKey: "`<namespace>/<pod>`."
    pod: "The pod's name."
    namespace: "The namespace it lives in, the same value as the KubeNamespace it was reached from."
    container: { type: string, description: "current: the container running now. previous: the one before the last restart.", values: [current, previous] }
    line: { type: int, description: "First line of the event in what was read." }
    endLine: { type: int, description: "Last line of the event." }
    content: "The event's whole text."
    timestamp: "When the event was logged, as the application's log layout wrote it (often local time, no zone); not normalised. Empty when the line has none."
    level: "The log level exactly as the line wrote it (ERROR, error, E, WARNING…); compare `severity` for one scale."
    severity: "The level on one scale, upper case: ERROR, WARN, INFO, DEBUG or TRACE. Empty when the line names no level."
    thread: "The thread, where the layout shows it."
    logger: "The logger, where the layout shows it."
    message: "The message on the event's first line."
    hasTrace: { type: boolean, description: "True when the event logged a stack trace." }
    exception: "The exception thrown, where the event logged one."
    exceptionMessage: "The thrown exception's message, the text after its class name; empty when thrown with none."
    rootCause: "The exception at the bottom of the cause chain."
    causes: { cardinality: LIST, description: "The causes, in order." }
    frameCount: { type: int, description: "Frames printed across the trace." }
    fingerprint: "The same for the same thrown and root exceptions at the same frames."
  virtualJoins:
    - { anchorLabel: KubePod, relationship: HAS_LOG_EVENT, keyField: logKey, recordKeyField: podKey, producer: kubePodLogs, maxAnchors: 50, maxFanoutTotal: 100000,
        description: "What the pod's running container wrote: `MATCH (n:KubeNamespace {name:$ns})-[:HAS_POD]->(p:KubePod)-[:HAS_LOG_EVENT]->(e:KubeLogEvent)`; narrow with `{hasTrace: true}` or `{severity: 'ERROR'}`." }
    - { anchorLabel: KubePod, relationship: HAS_PREVIOUS_LOG_EVENT, keyField: logKey, recordKeyField: podKey, producer: kubePreviousPodLogs, maxAnchors: 50, maxFanoutTotal: 100000,
        description: "What the container before the last restart wrote: where a crashed pod's failure is." }
